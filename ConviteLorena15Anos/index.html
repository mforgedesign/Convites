<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Convite - Lorena | Debutante</title>

    <meta property="og:title" content="Convite - Lorena | Debutante">
    <meta property="og:description" content="Clique para ver o convite interativo!">
    <meta property="og:image" content="capa/capa_1767708111.jpg?v=1767708111">
    <meta property="og:type" content="website">

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            background-color: #000;
        }

        /* Utilitários de Transição e Camadas */
        .camada {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.8s ease-in-out;
        }

        /* Contorno Cinza no Texto (Stroke) */
        .texto-capa {
            color: white;
            text-shadow:
                -1px -1px 0 #555,
                1px -1px 0 #555,
                -1px 1px 0 #555,
                1px 1px 0 #555;
            /* Simula contorno cinza */
        }

        /* Animação da Mãozinha */
        @keyframes clicando {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(0.9);
            }
        }

        .animar-clique {
            animation: clicando 1.5s infinite ease-in-out;
        }

        /* Classes de Estado */
        .invisivel {
            opacity: 0;
            pointer-events: none;
        }

        .visivel {
            opacity: 1;
            pointer-events: auto;
        }

        /* Popup Manual */
        #popupManual {
            transition: opacity 0.3s ease-in-out;
        }

        .blur-background {
            filter: blur(5px) brightness(0.5);
        }

        /* Sombra suave para o cronômetro */
        .texto-sombra {
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.8);
        }
    </style>

            <style>
                :root {
                    --button-color: #7c5a8c;
                }
                .custom-button-bg {
                    background-color: var(--button-color) !important;
                }
                
            </style>
            
</head>

<body class="w-full h-[100dvh] flex justify-center items-center">

    <div id="mainContainer"
        class="relative w-full max-w-[480px] h-full bg-black shadow-2xl overflow-hidden transition-all duration-300">

        <video id="videoLoop" class="camada z-10 invisivel" playsinline loop muted>
            <source src="loop/loop_1767708111.mp4?v=1767708111" type="video/mp4">
        </video>

        <video id="videoAbertura" class="camada z-20" playsinline muted>
            <source src="abertura/abertura_1767708111.mp4?v=1767708111" type="video/mp4">
        </video>

        <audio id="musicaFundo" loop preload="auto">
            <source src="musica/musica_1767708111.mp3?v=1767708111" type="audio/mp3">
        </audio>

        <button id="btnMute"
            class="absolute top-4 left-4 z-40 text-white bg-black/50 rounded-full w-10 h-10 flex items-center justify-center invisivel transition-all hover:bg-black/70">
            <i class="fa-solid fa-volume-high" id="iconMute"></i>
        </button>

        <button id="btnPular"
            class="absolute top-4 right-4 z-40 bg-white/20 backdrop-blur-sm border border-white/40 text-white px-4 py-1 rounded-full text-xs font-semibold uppercase tracking-wider invisivel hover:bg-white/30 transition-all">
            Pular
        </button>

        <div id="countdownContainer"
            class="absolute top-[34px] left-0 w-full z-40 flex flex-col items-center justify-center invisivel transition-opacity duration-1000 texto-sombra pointer-events-none ">
            <h2 class="text-white text-[10px] sm:text-xs uppercase tracking-[0.2em] mb-2 font-semibold opacity-90">
                Contagem Regressiva</h2>
            <div class="flex gap-3 sm:gap-4 text-white">
                <div class="flex flex-col items-center">
                    <span id="contadorMeses" class="text-xl sm:text-2xl font-bold leading-none">00</span>
                    <span class="text-[8px] sm:text-[10px] uppercase opacity-80">Meses</span>
                </div>
                <div class="flex flex-col items-center">
                    <span id="contadorDias" class="text-xl sm:text-2xl font-bold leading-none">00</span>
                    <span class="text-[8px] sm:text-[10px] uppercase opacity-80">Dias</span>
                </div>
                <div class="flex flex-col items-center">
                    <span id="contadorHoras" class="text-xl sm:text-2xl font-bold leading-none">00</span>
                    <span class="text-[8px] sm:text-[10px] uppercase opacity-80">Hs</span>
                </div>
                <div class="flex flex-col items-center">
                    <span id="contadorMinutos" class="text-xl sm:text-2xl font-bold leading-none">00</span>
                    <span class="text-[8px] sm:text-[10px] uppercase opacity-80">Min</span>
                </div>
            </div>
        </div>

        <div id="containerShadow"
            class="absolute bottom-0 left-0 w-full z-30 pb-10 px-2 pt-20 invisivel transition-opacity duration-1000"
            style="background: linear-gradient(to top, #000000E6, #00000066, transparent);">
        </div>

        <div id="containerBotoes"
            class="absolute left-0 w-full z-40 pb-10 px-2 invisivel transition-opacity duration-1000 flex justify-center"
            style="bottom: 0px;">
            <div id="gridBotoes" class="flex flex-row flex-nowrap justify-evenly gap-1 w-full max-w-[480px]">
            </div>
        </div>

        <div id="capaInicial"
            class="absolute inset-0 z-50 bg-cover bg-center flex flex-col items-center justify-center cursor-pointer transition-opacity duration-700"
            style="background-image: url('capa/capa_1767708111.jpg?v=1767708111');">
            <div class="absolute inset-0 bg-black/20"></div>

            <div id="dicaInteractionContainer" class="relative z-10 flex flex-col items-center gap-4 animate-pulse">
                <i class="fa-solid fa-hand-pointer text-5xl text-white drop-shadow-lg animar-clique"></i>
                <h1 class="texto-capa text-2xl font-bold uppercase tracking-widest text-center px-4">
                    Clique para interagir!
                </h1>
            </div>
        </div>

    </div>

    <div id="popupManual"
        class="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 backdrop-blur-sm invisivel">
        <div
            class="relative w-full max-w-[400px] h-[80%] rounded-xl shadow-2xl overflow-hidden flex flex-col border border-white/20">
            <div class="absolute inset-0 z-0">
                <img src="loop/folha_vazia_1767708111.jpg?v=1767708111" class="w-full h-full object-cover opacity-90 blur-[2px]">
                <div class="absolute inset-0 bg-black/60"></div>
            </div>

            <div class="relative z-10 flex justify-between items-center p-4 border-b border-white/10">
                <h2 id="manualTitle" class="text-xl font-bold text-white">Manual do Convidado</h2>
                <button id="btnCloseManual" class="text-white hover:text-gray-300 transition-colors">
                    <i class="fa-solid fa-xmark text-2xl"></i>
                </button>
            </div>

            <div class="relative z-10 p-6 overflow-y-auto custom-scrollbar text-white text-center space-y-6">
                <div id="manualContent" class="text-sm leading-relaxed text-left">
                    </div>
            </div>
        </div>
    </div>

    <div id="popupPresentes"
        class="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 backdrop-blur-sm invisivel">
        <div class="relative max-w-[90vw] max-h-[90vh] rounded-xl shadow-2xl overflow-hidden">
            <button id="btnClosePresentes"
                class="absolute top-3 right-3 z-10 bg-black/50 text-white hover:bg-black/70 rounded-full w-10 h-10 flex items-center justify-center transition-colors border border-white/20">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <img id="imagemPresentes" src="presentes/presentes.jpg"
                class="max-w-full max-h-[85vh] object-contain rounded-lg">
        </div>
    </div>

    <div id="popupManualImage"
        class="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 backdrop-blur-sm invisivel">
        <div class="relative max-w-[90vw] max-h-[90vh] rounded-xl shadow-2xl overflow-hidden">
            <button id="btnCloseManualImage"
                class="absolute top-3 right-3 z-10 bg-black/50 text-white hover:bg-black/70 rounded-full w-10 h-10 flex items-center justify-center transition-colors border border-white/20">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <img id="imagemManual" src="manual/manual.jpg" class="max-w-full max-h-[85vh] object-contain rounded-lg">
        </div>
    </div>

    <div id="popupRSVP"
        class="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 backdrop-blur-sm invisivel">
        <div
            class="relative w-full max-w-[350px] rounded-xl shadow-2xl overflow-hidden border border-white/20 m-4 flex flex-col">

            <div class="absolute inset-0 z-0">
                <img src="loop/folha_vazia_1767708111.jpg?v=1767708111" class="w-full h-full object-cover opacity-90 blur-[2px]">
                <div class="absolute inset-0 bg-black/70"></div>
            </div>

            <div
                class="relative z-10 flex justify-between items-center p-4 border-b border-white/10 bg-black/30 backdrop-blur-sm">
                <h2 class="text-lg font-bold text-white"><i class="fa-brands fa-whatsapp text-green-500 mr-2"></i>
                    Confirmar Presença</h2>
                <button id="btnCloseRSVP" class="text-white hover:text-gray-300 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <div class="relative z-10 p-6 space-y-4">
                <div>
                    <label class="block text-stone-300 text-xs font-bold mb-1 uppercase">Seu Nome Completo *</label>
                    <input type="text" id="rsvp-name"
                        class="w-full bg-black/40 border border-stone-500/50 rounded p-2 text-white focus:border-green-500 focus:outline-none placeholder-stone-400 truncate backdrop-blur-sm"
                        placeholder="Ex: Maria Silva">
                </div>

                <div>
                    <label class="block text-stone-300 text-xs font-bold mb-1 uppercase">Seu WhatsApp *</label>
                    <input type="tel" id="rsvp-phone"
                        class="w-full bg-black/40 border border-stone-500/50 rounded p-2 text-white focus:border-green-500 focus:outline-none placeholder-stone-400 truncate backdrop-blur-sm"
                        placeholder="(DDD) 99999-9999">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-stone-300 text-[10px] font-bold mb-1 uppercase">Modelo do Carro</label>
                        <input type="text" id="rsvp-carro"
                            class="w-full bg-black/40 border border-stone-500/50 rounded p-2 text-white text-xs focus:border-green-500 focus:outline-none placeholder-stone-500 truncate backdrop-blur-sm"
                            placeholder="Ex: Corolla">
                    </div>
                    <div>
                        <label class="block text-stone-300 text-[10px] font-bold mb-1 uppercase">Placa do Carro</label>
                        <input type="text" id="rsvp-placa"
                            class="w-full bg-black/40 border border-stone-500/50 rounded p-2 text-white text-xs focus:border-green-500 focus:outline-none placeholder-stone-500 truncate backdrop-blur-sm"
                            placeholder="ABC-1234">
                    </div>
                </div>

                <button id="btn-confirm-rsvp"
                    class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-lg transition-colors mt-2 shadow-lg flex items-center justify-center gap-2">
                    Confirmar no WhatsApp <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==================================================================
        // 1. CONFIGURAÇÃO DOS BOTÕES
        // ==================================================================
        const menuConfig = [
    {
        "id": "manual",
        "titulo": "Manual do Convidado",
        "icone": "fa-solid fa-book",
        "link": "#",
        "manualText": "<div>\n    <h3><i class=\"fa-solid fa-smile\"></i> Regras Importantes:</h3>\n    <ul>\n        <li><i class=\"fa-solid fa-clock\"></i> Se divertir muito!</li>\n        <li><i class=\"fa-solid fa-calendar-check\"></i> Chegue no horário: Sua presença pontual é muito importante para nós.</li>\n        <li><i class=\"fa-solid fa-check-circle\"></i> Confirme sua presença: Por favor, confirme presença pelo menos 15 dias antes do evento.</li>\n        <li><i class=\"fa-solid fa-party-horn\"></i> Divirta-se bastante! Estamos ansiosos para celebrar este momento especial com você.</li>\n        <li><i class=\"fa-solid fa-heart\"></i> Não vá embora sem me dar um abraço e comer um pedaço do bolo: Queremos compartilhar cada instante com você.</li>\n    </ul>\n</div>"
    },
    {
        "titulo": "Como Chegar",
        "icone": "fa-solid fa-location-dot",
        "link": "https://maps.app.goo.gl/5imL7oM51RDnbsFy5"
    },
    {
        "titulo": "Confirmar Presença",
        "icone": "fa-regular fa-circle-check",
        "link": "5511956761771"
    }
];
        const buttonSize = parseFloat('1') || 1.0;

        // ==================================================================
        // 2. REFERÊNCIAS DO DOM
        // ==================================================================
        const capa = document.getElementById('capaInicial');
        const videoAbertura = document.getElementById('videoAbertura');
        const videoLoop = document.getElementById('videoLoop');
        const audio = document.getElementById('musicaFundo');
        const btnPular = document.getElementById('btnPular');
        const btnMute = document.getElementById('btnMute');
        const iconMute = document.getElementById('iconMute');
        const containerBotoes = document.getElementById('containerBotoes');
        const containerShadow = document.getElementById('containerShadow');
        const gridBotoes = document.getElementById('gridBotoes');

        const popupManual = document.getElementById('popupManual');
        const btnCloseManual = document.getElementById('btnCloseManual');
        const manualContent = document.getElementById('manualContent');

        const popupPresentes = document.getElementById('popupPresentes');
        const btnClosePresentes = document.getElementById('btnClosePresentes');

        const popupRSVP = document.getElementById('popupRSVP');
        const btnCloseRSVP = document.getElementById('btnCloseRSVP');
        const inputName = document.getElementById('rsvp-name');
        const inputPhone = document.getElementById('rsvp-phone');
        const inputCarro = document.getElementById('rsvp-carro');
        const inputPlaca = document.getElementById('rsvp-placa');
        const btnConfirmRSVP = document.getElementById('btn-confirm-rsvp');
        
        let currentRSVPNumber = "";
        let transicaoFeita = false;
        let estaMutado = false;
        let iniciouInteracao = false;

        const countdownContainer = document.getElementById('countdownContainer');

        // ==================================================================
        // 7. LÓGICA DOS POPUPS
        // ==================================================================
        window.abrirManual = function (e) {
            e.preventDefault();
            popupManual.classList.remove('invisivel');
        }

        btnCloseManual.addEventListener('click', () => {
            popupManual.classList.add('invisivel');
        });

        window.abrirPresentes = function (e) {
            e.preventDefault();
            popupPresentes.classList.remove('invisivel');
        }

        btnClosePresentes.addEventListener('click', () => {
            popupPresentes.classList.add('invisivel');
        });

        const popupManualImage = document.getElementById('popupManualImage');
        const btnCloseManualImage = document.getElementById('btnCloseManualImage');

        window.abrirManualImage = function (e) {
            e.preventDefault();
            popupManualImage.classList.remove('invisivel');
        }

        if (btnCloseManualImage) {
            btnCloseManualImage.addEventListener('click', () => {
                popupManualImage.classList.add('invisivel');
            });
        }

        // ==================================================================
        // 9. LÓGICA DO POPUP RSVP (REDEFINIDA PARA VEÍCULOS)
        // ==================================================================
        window.abrirRSVP = function (e, link) {
            e.preventDefault();

            const isWhatsappLink = link.includes("wa.me") || link.includes("whatsapp.com");
            const isExternalUrl = link.startsWith("http") && !isWhatsappLink;

            if (isExternalUrl) {
                window.open(link, '_blank');
                return;
            }

            currentRSVPNumber = link.replace(/\D/g, '');

            // Reset Form
            inputName.value = "";
            inputPhone.value = "";
            inputCarro.value = "";
            inputPlaca.value = "";

            popupRSVP.classList.remove('invisivel');
        }

        btnCloseRSVP.addEventListener('click', () => popupRSVP.classList.add('invisivel'));

        btnConfirmRSVP.addEventListener('click', () => {
            const name = inputName.value.trim();
            const phone = inputPhone.value.trim();
            const carro = inputCarro.value.trim();
            const placa = inputPlaca.value.trim();

            if (!name || !phone) {
                alert("Por favor, preencha pelo menos Nome e WhatsApp.");
                return;
            }

            let message = `Olá! Gostaria de confirmar minha presença.\n\n*Nome:* ${name}\n*Telefone:* ${phone}`;
            
            if (carro) message += `\n*Veículo:* ${carro}`;
            if (placa) message += `\n*Placa:* ${placa}`;

            const waUrl = `https://wa.me/${currentRSVPNumber}?text=${encodeURIComponent(message)}`;
            window.open(waUrl, '_blank');

            popupRSVP.classList.add('invisivel');
        });

        // ==================================================================
        // 3. GERAR BOTÕES DINAMICAMENTE
        // ==================================================================
        menuConfig.forEach(btn => {
            if (btn.link && (btn.link.trim() !== "" || btn.isGiftImage || btn.isManualImage)) {
                const isGiftImage = btn.isGiftImage === true;
                const isManualImage = btn.isManualImage === true;

                const anchor = document.createElement('a');
                anchor.className = "group flex flex-col items-center gap-1 focus:outline-none min-w-[50px] max-w-[80px] cursor-pointer";
                
                const isRSVP = btn.titulo.toLowerCase().includes("confirmar") || btn.titulo.toLowerCase().includes("presença");

                if (btn.id === 'manual' && isManualImage) {
                    anchor.href = "#";
                    anchor.addEventListener('click', abrirManualImage);
                } else if (btn.id === 'manual') {
                    anchor.href = "#";
                    anchor.addEventListener('click', abrirManual);
                } else if (isGiftImage) {
                    anchor.href = "#";
                    anchor.addEventListener('click', abrirPresentes);
                } else if (isRSVP) {
                    anchor.href = "#";
                    anchor.addEventListener('click', (e) => abrirRSVP(e, btn.link));
                } else {
                    anchor.href = btn.link;
                    anchor.target = "_blank";
                }

                const basePx = 48;
                const sizePx = basePx * buttonSize;
                const baseIconRem = 1.125;
                const iconRem = baseIconRem * buttonSize;

                anchor.innerHTML = `
                    <div class="rounded-full border border-stone-300 p-[2px] transition-transform duration-300 group-hover:scale-105 group-active:scale-95">
                        <div class="rounded-full bg-stone-800 custom-button-bg text-white flex items-center justify-center shadow-lg group-hover:bg-stone-700 transition-colors"
                             style="width: ${sizePx}px; height: ${sizePx}px;">
                            <i class="${btn.icone}" style="font-size: ${iconRem}rem;"></i>
                        </div>
                    </div>
                    <span class="text-[10px] uppercase font-bold text-white tracking-wide text-center leading-tight drop-shadow-md">
                        ${btn.titulo}
                    </span>
                    `;

                gridBotoes.appendChild(anchor);

                if (btn.id === 'manual' && btn.manualText) {
                    manualContent.innerHTML = btn.manualText;
                }
            }
        });

        // ==================================================================
        // 4. LÓGICA DE INÍCIO E VÍDEOS
        // ==================================================================
        capa.addEventListener('click', function () {
            if (iniciouInteracao) return;
            iniciouInteracao = true;
            capa.classList.add('invisivel');

            if (audio) {
                audio.volume = 0.5;
                audio.load();
                audio.play().catch(e => console.log("Erro audio:", e));
            }

            if (videoLoop) {
                videoLoop.play().catch(e => console.log("Erro loop:", e));
            }

            if (videoAbertura) {
                videoAbertura.play().catch(e => console.log("Erro abertura:", e));
            }

            btnPular.classList.remove('invisivel');
            btnMute.classList.remove('invisivel');
        });

        function irParaLoop() {
            if (transicaoFeita) return;
            transicaoFeita = true;
            btnPular.classList.add('invisivel');
            videoLoop.classList.remove('invisivel');
            videoAbertura.classList.add('invisivel');
            containerBotoes.classList.remove('invisivel');
            containerShadow.classList.remove('invisivel');

            if (countdownContainer && !countdownContainer.classList.contains('hidden')) {
                countdownContainer.classList.remove('invisivel');
            }
            setTimeout(() => videoAbertura.pause(), 800);
        }

        videoAbertura.onended = irParaLoop;
        videoAbertura.ontimeupdate = function () {
            if (videoAbertura.duration > 0 && videoAbertura.currentTime >= videoAbertura.duration - 0.5) {
                irParaLoop();
            }
        };
        btnPular.onclick = irParaLoop;

        btnMute.addEventListener('click', () => {
            estaMutado = !estaMutado;
            audio.muted = estaMutado;
            videoAbertura.muted = estaMutado;
            videoLoop.muted = estaMutado;
            iconMute.className = estaMutado ? "fa-solid fa-volume-xmark" : "fa-solid fa-volume-high";
            btnMute.classList.toggle("bg-red-500/50", estaMutado);
        });

        // ==================================================================
        // TIMER
        // ==================================================================
        function atualizarCronometro() {
            const dataAlvo = new Date('2026-01-24T19:00:00');
            const agora = new Date();
            let diferenca = dataAlvo - agora;

            if (diferenca <= 0 || isNaN(dataAlvo.getTime())) return;

            let anos = dataAlvo.getFullYear() - agora.getFullYear();
            let meses = dataAlvo.getMonth() - agora.getMonth();
            let dias = dataAlvo.getDate() - agora.getDate();
            let horas = dataAlvo.getHours() - agora.getHours();
            let minutos = dataAlvo.getMinutes() - agora.getMinutes();

            if (minutos < 0) { minutos += 60; horas--; }
            if (horas < 0) { horas += 24; dias--; }
            if (dias < 0) {
                const mesAnterior = new Date(dataAlvo.getFullYear(), dataAlvo.getMonth(), 0);
                dias += mesAnterior.getDate();
                meses--;
            }
            if (meses < 0) { meses += 12; anos--; }

            const totalMeses = (anos * 12) + meses;
            const fmt = (num) => num < 10 ? `0${num}` : num;

            document.getElementById('contadorMeses').innerText = fmt(totalMeses);
            document.getElementById('contadorDias').innerText = fmt(dias);
            document.getElementById('contadorHoras').innerText = fmt(horas);
            document.getElementById('contadorMinutos').innerText = fmt(minutos);
        }

        atualizarCronometro();
        setInterval(atualizarCronometro, 1000);
    </script>
</body>
</html>
