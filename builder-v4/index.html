<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoBuilder v4 - Criador de Convites Digitais</title>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .dropzone {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .dropzone:hover,
        .dropzone.drag-over {
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.05);
        }

        .preview-image {
            max-width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 12px;
        }

        .nav-pill.active {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body class="font-sans">
    <div id="app" class="container mx-auto px-4 py-8">
        <header class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">AutoBuilder v4</h1>
            <p class="text-lg md:text-xl text-white/80">Crie convites digitais interativos com IA</p>
        </header>

        <div class="max-w-7xl mx-auto">
            <!-- Navigation Pills -->
            <div class="flex gap-2 mb-6 overflow-x-auto pb-4 scrollbar-hide">
                <button onclick="showWindow('chatbot')"
                    class="nav-pill px-4 py-2 rounded-lg glass-effect text-white hover:bg-white/20 transition text-sm whitespace-nowrap">
                    <i class="fas fa-comments mr-1"></i> Chatbot
                </button>
                <button onclick="showWindow('form')"
                    class="nav-pill px-4 py-2 rounded-lg glass-effect text-white hover:bg-white/20 transition text-sm whitespace-nowrap">
                    <i class="fas fa-wpforms mr-1"></i> Formulário
                </button>
                <button onclick="showWindow('history')"
                    class="nav-pill px-4 py-2 rounded-lg glass-effect text-white hover:bg-white/20 transition text-sm whitespace-nowrap">
                    <i class="fas fa-history mr-1"></i> Histórico
                </button>
                <button onclick="showWindow('cover')"
                    class="nav-pill px-4 py-2 rounded-lg glass-effect text-white hover:bg-white/20 transition text-sm whitespace-nowrap">
                    <i class="fas fa-image mr-1"></i> Capa
                </button>
                <button onclick="showWindow('sheet')"
                    class="nav-pill px-4 py-2 rounded-lg glass-effect text-white hover:bg-white/20 transition text-sm whitespace-nowrap">
                    <i class="fas fa-file mr-1"></i> Folha
                </button>
                <button onclick="showWindow('animation')"
                    class="nav-pill px-4 py-2 rounded-lg glass-effect text-white hover:bg-white/20 transition text-sm whitespace-nowrap">
                    <i class="fas fa-video mr-1"></i> Animações
                </button>
                <button onclick="showWindow('gifts')"
                    class="nav-pill px-4 py-2 rounded-lg glass-effect text-white hover:bg-white/20 transition text-sm whitespace-nowrap">
                    <i class="fas fa-gift mr-1"></i> Presentes
                </button>
                <button onclick="showWindow('manual')"
                    class="nav-pill px-4 py-2 rounded-lg glass-effect text-white hover:bg-white/20 transition text-sm whitespace-nowrap">
                    <i class="fas fa-book mr-1"></i> Manual
                </button>
                <button onclick="showWindow('music')"
                    class="nav-pill px-4 py-2 rounded-lg glass-effect text-white hover:bg-white/20 transition text-sm whitespace-nowrap">
                    <i class="fas fa-music mr-1"></i> Música
                </button>
                <button onclick="showWindow('finalize')"
                    class="nav-pill px-4 py-2 rounded-lg glass-effect text-white hover:bg-white/20 transition text-sm whitespace-nowrap">
                    <i class="fas fa-rocket mr-1"></i> Publicar
                </button>
            </div>

            <!-- Dynamic Content Area -->
            <div id="content-area" class="glass-effect rounded-2xl p-4 md:p-8 min-h-[600px]">
                <div class="text-center text-white">
                    <i class="fas fa-spinner fa-spin text-6xl mb-4"></i>
                    <p class="text-xl">Carregando...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase Configuration & Main App Logic -->
    <script>
        const SUPABASE_URL = 'https://ymttaaebrqcfrgipqwvy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJ...'; // Truncado para brevidade
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Global State
        let builderState = {
            currentInvitationId: null,
            currentWindow: 'chatbot',
            formData: {},
            assets: {
                cover: null,
                sheet: null,
                sheetFilled: null,
                opening: null,
                loop: null,
                music: null,
                manual: null,
                gifts: null
            },
            conversationHistory: []
        };

        // Window Navigation
        function showWindow(windowName) {
            builderState.currentWindow = windowName;

            // Update active nav pill
            document.querySelectorAll('.nav-pill').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const contentArea = document.getElementById('content-area');
            const renders = {
                'chatbot': renderChatbotWindow,
                'form': renderFormWindow,
                'history': renderHistoryWindow,
                'cover': renderCoverWindow,
                'sheet': renderSheetWindow,
                'animation': renderAnimationWindow,
                'gifts': renderGiftsWindow,
                'manual': renderManualWindow,
                'music': renderMusicWindow,
                'finalize': renderFinalizeWindow
            };

            contentArea.innerHTML = renders[windowName] ? renders[windowName]() : '<p class="text-white">Janela não encontrada</p>';

            // Init specific window
            const inits = {
                'chatbot': initChatbot,
                'form': initForm,
                'history': loadHistory,
                'cover': initCoverWindow,
                'sheet': initSheetWindow,
                'animation': initAnimationWindow,
                'gifts': initGiftsWindow,
                'manual': initManualWindow,
                'music': initMusicWindow,
                'finalize': initFinalizeWindow
            };

            if (inits[windowName]) inits[windowName]();
        }

        // ============== CHATBOT WINDOW ==============
        function renderChatbotWindow() {
            return `
                <div class="flex flex-col h-full">
                    <h2 class="text-2xl md:text-3xl font-bold text-white mb-4">
                        <i class="fas fa-robot mr-2"></i>Chatbot Assistente
                    </h2>
                    
                    <div id="chat-messages" class="flex-1 overflow-y-auto mb-4 space-y-3 max-h-[400px] bg-black/20 rounded-lg p-4">
                        <div class="text-white/60 text-center py-8">
                            <i class="fas fa-comment-dots text-4xl mb-3"></i>
                            <p>Olá! Sou o AutoBuilder AI. Como posso ajudar a criar seu convite?</p>
                        </div>
                    </div>
                    
                    <div class="flex gap-3">
                        <input 
                            type="text" 
                            id="chat-input" 
                            placeholder="Digite ou arraste arquivos..."
                            class="flex-1 px-4 py-3 rounded-lg bg-white/10 text-white border border-white/20 focus:border-white/40 outline-none"
                            onkeypress="if(event.key==='Enter') sendMessage()"
                        />
                        <button 
                            onclick="sendMessage()" 
                            class="px-6 py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-lg transition">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function initChatbot() {
            console.log('Chatbot initialized');
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;

            const chatMessages = document.getElementById('chat-messages');
            chatMessages.innerHTML += `
                <div class="flex justify-end">
                    <div class="bg-blue-500 text-white px-4 py-2 rounded-lg max-w-[70%]">${message}</div>
                </div>
            `;

            input.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const { data, error } = await supabase.functions.invoke('chatbot-intent', {
                    body: { message, context: builderState, conversation_history: builderState.conversationHistory }
                });

                if (error) throw error;

                chatMessages.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-white/10 text-white px-4 py-2 rounded-lg max-w-[70%]">
                            <i class="fas fa-robot mr-2"></i>${data.message || 'Erro ao processar.'}
                        </div>
                    </div>
                `;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (err) {
                console.error('Chatbot error:', err);
            }
        }

        // ============== FORM WINDOW ==============
        function renderFormWindow() {
            return `
                <h2 class="text-2xl md:text-3xl font-bold text-white mb-6">
                    <i class="fas fa-wpforms mr-2"></i>Formulário do Convite
                </h2>
                
                <form id="invitation-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="md:col-span-2">
                        <h3 class="text-xl text-white font-semibold mb-3">Identidade do Evento</h3>
                    </div>
                    
                    <div>
                        <label class="block text-white mb-2 text-sm">Nome do Evento</label>
                        <input type="text" name="event_name" class="w-full px-4 py-2 rounded-lg bg-white/10 text-white border border-white/20 outline-none" />
                    </div>
                    
                    <div>
                        <label class="block text-white mb-2 text-sm">Tipo de Evento</label>
                        <select name="event_type" class="w-full px-4 py-2 rounded-lg bg-white/10 text-white border border-white/20 outline-none">
                            <option value="">Selecione...</option>
                            <option value="casamento">Casamento</option>
                            <option value="aniversario">Aniversário</option>
                            <option value="formatura">Formatura</option>
                            <option value="outros">Outros</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-white mb-2 text-sm">Data</label>
                        <input type="date" name="event_date" class="w-full px-4 py-2 rounded-lg bg-white/10 text-white border border-white/20 outline-none" />
                    </div>
                    
                    <div>
                        <label class="block text-white mb-2 text-sm">Hora</label>
                        <input type="time" name="event_time" class="w-full px-4 py-2 rounded-lg bg-white/10 text-white border border-white/20 outline-none" />
                    </div>
                    
                    <div>
                        <label class="block text-white mb-2 text-sm">Tema</label>
                        <input type="text" name="event_theme" placeholder="Tropical, Rústico..." class="w-full px-4 py-2 rounded-lg bg-white/10 text-white border border-white/20 outline-none" />
                    </div>
                    
                    <div>
                        <label class="block text-white mb-2 text-sm">Paleta de Cores</label>
                        <input type="text" name="color_palette" placeholder="Azul e Branco..." class="w-full px-4 py-2 rounded-lg bg-white/10 text-white border border-white/20 outline-none" />
                    </div>
                    
                    <div class="md:col-span-2 mt-4">
                        <button type="submit" class="px-8 py-3 bg-green-500 hover:bg-green-600 text-white rounded-lg transition">
                            <i class="fas fa-save mr-2"></i>Salvar Dados
                        </button>
                    </div>
                </form>
            `;
        }

        function initForm() {
            const form = document.getElementById('invitation-form');
            if (!form) return;

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(form);
                const data = Object.fromEntries(formData);
                Object.assign(builderState.formData, data);

                try {
                    const { error } = await supabase.from('invitations').upsert({
                        id: builderState.currentInvitationId,
                        user_id: 'anonymous',
                        slug: data.event_name?.toLowerCase().replace(/\s+/g, '-') || 'new-invitation',
                        ...data
                    });

                    if (error) throw error;
                    alert('✅ Dados salvos com sucesso!');
                } catch (err) {
                    console.error('Save error:', err);
                    alert('❌ Erro ao salvar dados.');
                }
            });
        }

        // ============== HISTORY WINDOW ==============
        function renderHistoryWindow() {
            return `
                <h2 class="text-2xl md:text-3xl font-bold text-white mb-6">
                    <i class="fas fa-history mr-2"></i>Histórico de Convites
                </h2>
                
                <div id="history-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div class="col-span-full text-center text-white/60 py-12">
                        <i class="fas fa-spinner fa-spin text-4xl mb-4"></i>
                        <p>Carregando histórico...</p>
                    </div>
                </div>
            `;
        }

        async function loadHistory() {
            try {
                const { data, error } = await supabase.from('invitations').select('*').order('created_at', { ascending: false });
                if (error) throw error;

                const historyList = document.getElementById('history-list');
                if (data.length === 0) {
                    historyList.innerHTML = `
                        <div class="col-span-full text-center text-white/60 py-12">
                            <i class="fas fa-inbox text-6xl mb-4"></i>
                            <p class="text-xl">Nenhum convite ainda</p>
                        </div>
                    `;
                    return;
                }

                historyList.innerHTML = data.map(inv => `
                    <div class="bg-white/10 rounded-lg p-4 hover:bg-white/20 transition">
                        <h3 class="text-lg font-bold text-white mb-2">${inv.event_name || 'Sem nome'}</h3>
                        <p class="text-white/60 text-sm mb-3">${inv.event_type || 'Tipo não definido'}</p>
                        <div class="flex gap-2">
                            <button class="flex-1 px-3 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded text-xs">
                                <i class="fas fa-edit mr-1"></i>Editar
                            </button>
                            <button class="flex-1 px-3 py-2 bg-green-500 hover:bg-green-600 text-white rounded text-xs">
                                <i class="fas fa-eye mr-1"></i>Ver
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Load history error:', err);
            }
        }

        // ============== COVER WINDOW ==============
        function renderCoverWindow() {
            return `
                <h2 class="text-2xl md:text-3xl font-bold text-white mb-6">
                    <i class="fas fa-image mr-2"></i>Capa do Convite
                </h2>
                
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div>
                        <h3 class="text-lg text-white font-semibold mb-3">Upload ou Gerar com IA</h3>
                        
                        <div id="cover-dropzone" class="dropzone rounded-lg p-8 text-center mb-4">
                            <i class="fas fa-cloud-upload-alt text-4xl text-white/50 mb-3"></i>
                            <p class="text-white/70">Arraste uma imagem ou clique para selecionar</p>
                            <input type="file" id="cover-file-input" accept="image/*" class="hidden" />
                        </div>
                        
                        <div id="cover-preview" class="hidden mb-4">
                            <img id="cover-preview-img" class="preview-image mx-auto" />
                        </div>
                        
                        <div class="space-y-3">
                            <textarea 
                                id="cover-prompt" 
                                placeholder="Descreva a capa desejada..."
                                class="w-full px-4 py-3 rounded-lg bg-white/10 text-white border border-white/20 outline-none resize-none"
                                rows="3"
                            ></textarea>
                            
                            <button onclick="generateCover()" class="w-full px-6 py-3 bg-purple-500 hover:bg-purple-600 text-white rounded-lg transition">
                                <i class="fas fa-magic mr-2"></i>Gerar Capa com IA
                            </button>
                        </div>
                    </div>
                    
                    <div>
                        <h3 class="text-lg text-white font-semibold mb-3">Dicas</h3>
                        <div class="bg-white/10 rounded-lg p-4 space-y-2 text-white/80 text-sm">
                            <p><i class="fas fa-lightbulb text-yellow-300 mr-2"></i>Use imagens 9:16 (vertical)</p>
                            <p><i class="fas fa-lightbulb text-yellow-300 mr-2"></i>Resolução mínima: 1080x1920px</p>
                            <p><i class="fas fa-lightbulb text-yellow-300 mr-2"></i>Formatos: JPG, PNG, WEBP</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function initCoverWindow() {
            const dropzone = document.getElementById('cover-dropzone');
            const fileInput = document.getElementById('cover-file-input');

            dropzone.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => handleCoverUpload(e.target.files[0]));

            // Drag and drop
            dropzone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropzone.classList.add('drag-over');
            });
            dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
            dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropzone.classList.remove('drag-over');
                handleCoverUpload(e.dataTransfer.files[0]);
            });
        }

        function handleCoverUpload(file) {
            if (!file || !file.type.startsWith('image/')) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('cover-preview-img').src = e.target.result;
                document.getElementById('cover-preview').classList.remove('hidden');
                builderState.assets.cover = file;
            };
            reader.readAsDataURL(file);
        }

        async function generateCover() {
            const prompt = document.getElementById('cover-prompt').value;
            if (!prompt) {
                alert('Digite uma descrição para a capa');
                return;
            }

            try {
                const { data, error } = await supabase.functions.invoke('generate-image', {
                    body: {
                        mode: 'text-to-image',
                        prompt: prompt,
                        model: 'seedream-v4',
                        target_window: 'cover'
                    }
                });

                if (error) throw error;

                document.getElementById('cover-preview-img').src = data.image_url;
                document.getElementById('cover-preview').classList.remove('hidden');
                alert('✅ Capa gerada com sucesso!');
            } catch (err) {
                console.error('Generate cover error:', err);
                alert('❌ Erro ao gerar capa');
            }
        }

        // ============== SHEET, ANIMATION, GIFTS, MANUAL, MUSIC WINDOWS ==============
        // (Similar patterns - skipped for brevity, but would follow same structure)

        function renderSheetWindow() {
            return `<h2 class="text-2xl text-white"><i class="fas fa-file mr-2"></i>Folha Vazia</h2><p class="text-white/70 mt-4">Janela em desenvolvimento...</p>`;
        }
        function initSheetWindow() { }

        function renderAnimationWindow() {
            return `<h2 class="text-2xl text-white"><i class="fas fa-video mr-2"></i>Animações</h2><p class="text-white/70 mt-4">Janela em desenvolvimento...</p>`;
        }
        function initAnimationWindow() { }

        function renderGiftsWindow() {
            return `<h2 class="text-2xl text-white"><i class="fas fa-gift mr-2"></i>Lista de Presentes</h2><p class="text-white/70 mt-4">Janela em desenvolvimento...</p>`;
        }
        function initGiftsWindow() { }

        function renderManualWindow() {
            return `<h2 class="text-2xl text-white"><i class="fas fa-book mr-2"></i>Manual do Convidado</h2><p class="text-white/70 mt-4">Janela em desenvolvimento...</p>`;
        }
        function initManualWindow() { }

        function renderMusicWindow() {
            return `<h2 class="text-2xl text-white"><i class="fas fa-music mr-2"></i>Música de Fundo</h2><p class="text-white/70 mt-4">Janela em desenvolvimento...</p>`;
        }
        function initMusicWindow() { }

        // ============== FINALIZE WINDOW ==============
        function renderFinalizeWindow() {
            return `
                <h2 class="text-2xl md:text-3xl font-bold text-white mb-6">
                    <i class="fas fa-rocket mr-2"></i>Publicar Convite
                </h2>
                
                <div class="space-y-6">
                    <div>
                        <label class="block text-white mb-2">Slug do Convite (URL)</label>
                        <input 
                            type="text" 
                            id="publish-slug" 
                            placeholder="meu-convite-2026"
                            class="w-full px-4 py-3 rounded-lg bg-white/10 text-white border border-white/20 outline-none"
                        />
                        <p class="text-white/50 text-sm mt-1">https://mforgedesign.github.io/Convites/<span id="slug-preview">seu-slug</span>/</p>
                    </div>
                    
                    <div class="flex items-center gap-3">
                        <input type="checkbox" id="watermark-toggle" class="w-5 h-5" checked />
                        <label for="watermark-toggle" class="text-white">Modo Prévia (com marca d'água)</label>
                    </div>
                    
                    <button onclick="publishInvitation()" class="w-full px-8 py-4 bg-green-500 hover:bg-green-600 text-white text-lg rounded-lg transition">
                        <i class="fas fa-cloud-upload-alt mr-2"></i>Publicar Agora
                    </button>
                    
                    <div id="publish-status" class="hidden bg-blue-500/20 border border-blue-500/40 rounded-lg p-4 text-white"></div>
                </div>
            `;
        }

        function initFinalizeWindow() {
            const slugInput = document.getElementById('publish-slug');
            const slugPreview = document.getElementById('slug-preview');

            slugInput.addEventListener('input', (e) => {
                slugPreview.textContent = e.target.value || 'seu-slug';
            });
        }

        async function publishInvitation() {
            const slug = document.getElementById('publish-slug').value;
            const watermark = document.getElementById('watermark-toggle').checked;

            if (!slug) {
                alert('Digite um slug válido');
                return;
            }

            const status = document.getElementById('publish-status');
            status.classList.remove('hidden');
            status.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Publicando...';

            try {
                // Build process would go here
                status.innerHTML = '✅ Convite publicado com sucesso!<br>🔗 <a href="https://mforgedesign.github.io/Convites/' + slug + '/" target="_blank" class="underline">Ver online</a>';
            } catch (err) {
                status.innerHTML = '❌ Erro ao publicar: ' + err.message;
            }
        }

        // Initialize app
        document.addEventListener('DOMContentLoaded', () => {
            showWindow('chatbot');
        });
    </script>
</body>

</html>
