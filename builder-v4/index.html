<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoBuilder v4 - Criador de Convites Digitais</title>
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Custom styles */
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="font-sans">
    <div id="app" class="container mx-auto px-4 py-8">
        <header class="text-center mb-12">
            <h1 class="text-5xl font-bold text-white mb-4">AutoBuilder v4</h1>
            <p class="text-xl text-white/80">Crie convites digitais interativos com IA</p>
        </header>
        
        <div class="max-w-6xl mx-auto">
            <!-- Navigation Pills -->
            <div class="flex gap-4 mb-8 overflow-x-auto pb-4">
                <button onclick="showWindow('chatbot')" class="px-6 py-3 rounded-lg glass-effect text-white hover:bg-white/20 transition">
                    <i class="fas fa-comments mr-2"></i> Chatbot
                </button>
                <button onclick="showWindow('form')" class="px-6 py-3 rounded-lg glass-effect text-white hover:bg-white/20 transition">
                    <i class="fas fa-wpforms mr-2"></i> Formulário
                </button>
                <button onclick="showWindow('history')" class="px-6 py-3 rounded-lg glass-effect text-white hover:bg-white/20 transition">
                    <i class="fas fa-history mr-2"></i> Histórico
                </button>
                <button onclick="showWindow('cover')" class="px-6 py-3 rounded-lg glass-effect text-white hover:bg-white/20 transition">
                    <i class="fas fa-image mr-2"></i> Capa
                </button>
                <button onclick="showWindow('sheet')" class="px-6 py-3 rounded-lg glass-effect text-white hover:bg-white/20 transition">
                    <i class="fas fa-file mr-2"></i> Folha
                </button>
                <button onclick="showWindow('animation')" class="px-6 py-3 rounded-lg glass-effect text-white hover:bg-white/20 transition">
                    <i class="fas fa-video mr-2"></i> Animações
                </button>
                <button onclick="showWindow('gifts')" class="px-6 py-3 rounded-lg glass-effect text-white hover:bg-white/20 transition">
                    <i class="fas fa-gift mr-2"></i> Presentes
                </button>
                <button onclick="showWindow('manual')" class="px-6 py-3 rounded-lg glass-effect text-white hover:bg-white/20 transition">
                    <i class="fas fa-book mr-2"></i> Manual
                </button>
                <button onclick="showWindow('music')" class="px-6 py-3 rounded-lg glass-effect text-white hover:bg-white/20 transition">
                    <i class="fas fa-music mr-2"></i> Música
                </button>
                <button onclick="showWindow('finalize')" class="px-6 py-3 rounded-lg glass-effect text-white hover:bg-white/20 transition">
                    <i class="fas fa-rocket mr-2"></i> Publicar
                </button>
            </div>
            
            <!-- Dynamic Content Area -->
            <div id="content-area" class="glass-effect rounded-2xl p-8 min-h-[600px]">
                <!-- Content will be loaded here -->
                <div class="text-center text-white">
                    <i class="fas fa-spinner fa-spin text-6xl mb-4"></i>
                    <p class="text-xl">Carregando...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase Configuration -->
    <script>
        // Supabase initialization
        const SUPABASE_URL = 'https://ymttaaebrqcfrgipqwvy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InltdHRhYWVicnFjZnJnaXBxd3Z5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxMjM0MzAsImV4cCI6MjA4MjY5OTQzMH0.il4DFa2WDfwnqgsj5i5Ny0SklMZz1sta_eZisctuLYs';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Global state
        let builderState = {
            currentInvitationId: null,
            currentWindow: 'chatbot',
            formData: {},
            assets: {},
            conversationHistory: []
        };
        
        // Window navigation
        function showWindow(windowName) {
            builderState.currentWindow = windowName;
            const contentArea = document.getElementById('content-area');
            
            // Load appropriate content based on window
            switch(windowName) {
                case 'chatbot':
                    contentArea.innerHTML = renderChatbotWindow();
                    initChatbot();
                    break;
                case 'form':
                    contentArea.innerHTML = renderFormWindow();
                    initForm();
                    break;
                case 'history':
                    contentArea.innerHTML = renderHistoryWindow();
                    loadHistory();
                    break;
                case 'cover':
                    contentArea.innerHTML = renderCoverWindow();
                    break;
                case 'sheet':
                    contentArea.innerHTML = renderSheetWindow();
                    break;
                case 'animation':
                    contentArea.innerHTML = renderAnimationWindow();
                    break;
                case 'gifts':
                    contentArea.innerHTML = renderGiftsWindow();
                    break;
                case 'manual':
                    contentArea.innerHTML = renderManualWindow();
                    break;
                case 'music':
                    contentArea.innerHTML = renderMusicWindow();
                    break;
                case 'finalize':
                    contentArea.innerHTML = renderFinalizeWindow();
                    break;
                default:
                    contentArea.innerHTML = '<p class="text-white">Janela não encontrada</p>';
            }
        }
        
        // Render functions for each window
        function renderChatbotWindow() {
            return `
                <div class="flex flex-col h-full">
                    <h2 class="text-3xl font-bold text-white mb-6">
                        <i class="fas fa-robot mr-3"></i>Chatbot Assistente
                    </h2>
                    
                    <div id="chat-messages" class="flex-1 overflow-y-auto mb-4 space-y-4 max-h-[400px] bg-black/20 rounded-lg p-4">
                        <div class="text-white/60 text-center py-8">
                            Olá! Sou o AutoBuilder AI. Como posso ajudar a criar seu convite?
                        </div>
                    </div>
                    
                    <div class="flex gap-4">
                        <input 
                            type="text" 
                            id="chat-input" 
                            placeholder="Digite sua mensagem ou arraste arquivos aqui..."
                            class="flex-1 px-4 py-3 rounded-lg bg-white/10 text-white border border-white/20 focus:border-white/40 outline-none"
                            onkeypress="if(event.key==='Enter') sendMessage()"
                        />
                        <button 
                            onclick="sendMessage()" 
                            class="px-6 py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-lg transition">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                    
                    <div class="mt-4 text-white/60 text-sm">
                        <i class="fas fa-info-circle mr-2"></i>
                        Você pode enviar comandos como "Criar capa com tema tropical" ou fazer upload de imagens
                    </div>
                </div>
            `;
        }
        
        function renderFormWindow() {
            return `
                <h2 class="text-3xl font-bold text-white mb-6">
                    <i class="fas fa-wpforms mr-3"></i>Formulário do Convite
                </h2>
                
                <form id="invitation-form" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-white mb-2">Nome do Evento</label>
                        <input type="text" name="event_name" class="w-full px-4 py-2 rounded-lg bg-white/10 text-white border border-white/20 outline-none" />
                    </div>
                    
                    <div>
                        <label class="block text-white mb-2">Tipo de Evento</label>
                        <select name="event_type" class="w-full px-4 py-2 rounded-lg bg-white/10 text-white border border-white/20 outline-none">
                            <option value="">Selecione...</option>
                            <option value="casamento">Casamento</option>
                            <option value="aniversario">Aniversário</option>
                            <option value="formatura">Formatura</option>
                            <option value="outros">Outros</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-white mb-2">Data</label>
                        <input type="date" name="event_date" class="w-full px-4 py-2 rounded-lg bg-white/10 text-white border border-white/20 outline-none" />
                    </div>
                    
                    <div>
                        <label class="block text-white mb-2">Hora</label>
                        <input type="time" name="event_time" class="w-full px-4 py-2 rounded-lg bg-white/10 text-white border border-white/20 outline-none" />
                    </div>
                    
                    <div>
                        <label class="block text-white mb-2">Tema do Evento</label>
                        <input type="text" name="event_theme" placeholder="Ex: Tropical, Rústico..." class="w-full px-4 py-2 rounded-lg bg-white/10 text-white border border-white/20 outline-none" />
                    </div>
                    
                    <div>
                        <label class="block text-white mb-2">Paleta de Cores</label>
                        <input type="text" name="color_palette" placeholder="Ex: Azul e Branco, Rosa Gold..." class="w-full px-4 py-2 rounded-lg bg-white/10 text-white border border-white/20 outline-none" />
                    </div>
                    
                    <div class="md:col-span-2">
                        <button type="submit" class="px-8 py-3 bg-green-500 hover:bg-green-600 text-white rounded-lg transition">
                            <i class="fas fa-save mr-2"></i>Salvar Dados
                        </button>
                    </div>
                </form>
            `;
        }
        
        function renderHistoryWindow() {
            return `
                <h2 class="text-3xl font-bold text-white mb-6">
                    <i class="fas fa-history mr-3"></i>Histórico de Convites
                </h2>
                
                <div id="history-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div class="text-center text-white/60 py-12">
                        <i class="fas fa-spinner fa-spin text-4xl mb-4"></i>
                        <p>Carregando histórico...</p>
                    </div>
                </div>
            `;
        }
        
        function renderCoverWindow() {
            return `
                <h2 class="text-3xl font-bold text-white mb-6">
                    <i class="fas fa-image mr-3"></i>Capa do Convite
                </h2>
                <p class="text-white">Janela de criação de capa em desenvolvimento...</p>
            `;
        }
        
        function renderSheetWindow() {
            return `<h2 class="text-3xl font-bold text-white mb-6"><i class="fas fa-file mr-3"></i>Folha Vazia</h2><p class="text-white">Em desenvolvimento...</p>`;
        }
        
        function renderAnimationWindow() {
            return `<h2 class="text-3xl font-bold text-white mb-6"><i class="fas fa-video mr-3"></i>Animações</h2><p class="text-white">Em desenvolvimento...</p>`;
        }
        
        function renderGiftsWindow() {
            return `<h2 class="text-3xl font-bold text-white mb-6"><i class="fas fa-gift mr-3"></i>Lista de Presentes</h2><p class="text-white">Em desenvolvimento...</p>`;
        }
        
        function renderManualWindow() {
            return `<h2 class="text-3xl font-bold text-white mb-6"><i class="fas fa-book mr-3"></i>Manual do Convidado</h2><p class="text-white">Em desenvolvimento...</p>`;
        }
        
        function renderMusicWindow() {
            return `<h2 class="text-3xl font-bold text-white mb-6"><i class="fas fa-music mr-3"></i>Música de Fundo</h2><p class="text-white">Em desenvolvimento...</p>`;
        }
        
        function renderFinalizeWindow() {
            return `<h2 class="text-3xl font-bold text-white mb-6"><i class="fas fa-rocket mr-3"></i>Publicar Convite</h2><p class="text-white">Em desenvolvimento...</p>`;
        }
        
        // Chatbot functions
        function initChatbot() {
            // Initialize chatbot UI
            console.log('Chatbot initialized');
        }
        
        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Add user message to chat
            const chatMessages = document.getElementById('chat-messages');
            chatMessages.innerHTML += `
                <div class="flex justify-end">
                    <div class="bg-blue-500 text-white px-4 py-2 rounded-lg max-w-[70%]">
                        ${message}
                    </div>
                </div>
            `;
            
            input.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            // Call Supabase Edge Function
            try {
                const { data, error } = await supabase.functions.invoke('chatbot-intent', {
                    body: {
                        message: message,
                        context: builderState,
                        conversation_history: builderState.conversationHistory
                    }
                });
                
                if (error) throw error;
                
                // Add AI response to chat
                chatMessages.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-white/10 text-white px-4 py-2 rounded-lg max-w-[70%]">
                            <i class="fas fa-robot mr-2"></i>${data.message || 'Desculpe, ocorreu um erro.'}
                        </div>
                    </div>
                `;
                
                chatMessages.scrollTop = chatMessages.scrollHeight;
                
                // Execute actions if any
                if (data.actions && data.actions.length > 0) {
                    for (const action of data.actions) {
                        await executeAction(action);
                    }
                }
            } catch (err) {
                console.error('Chatbot error:', err);
                chatMessages.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-red-500/20 text-white px-4 py-2 rounded-lg max-w-[70%]">
                            <i class="fas fa-exclamation-circle mr-2"></i>Erro ao processar mensagem.
                        </div>
                    </div>
                `;
            }
        }
        
        async function executeAction(action) {
            console.log('Executing action:', action);
            // Implement action execution logic
        }
        
        // Form functions
        function initForm() {
            const form = document.getElementById('invitation-form');
            if (!form) return;
            
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const formData = new FormData(form);
                const data = Object.fromEntries(formData);
                
                Object.assign(builderState.formData, data);
                
                // Save to Supabase
                try {
                    const { error } = await supabase
                        .from('invitations')
                        .upsert({
                            id: builderState.currentInvitationId,
                            user_id: 'anonymous', // Replace with auth
                            slug: data.event_name?.toLowerCase().replace(/\s+/g, '-') || 'new-invitation',
                            ...data
                        });
                    
                    if (error) throw error;
                    
                    alert('Dados salvos com sucesso!');
                } catch (err) {
                    console.error('Save error:', err);
                    alert('Erro ao salvar dados.');
                }
            });
        }
        
        // History functions
        async function loadHistory() {
            try {
                const { data, error } = await supabase
                    .from('invitations')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (error) throw error;
                
                const historyList = document.getElementById('history-list');
                
                if (data.length === 0) {
                    historyList.innerHTML = `
                        <div class="col-span-full text-center text-white/60 py-12">
                            <i class="fas fa-inbox text-6xl mb-4"></i>
                            <p class="text-xl">Nenhum convite ainda</p>
                            <p class="mt-2">Comece criando seu primeiro convite!</p>
                        </div>
                    `;
                    return;
                }
                
                historyList.innerHTML = data.map(invitation => `
                    <div class="bg-white/10 rounded-lg p-6 hover:bg-white/20 transition cursor-pointer">
                        <h3 class="text-xl font-bold text-white mb-2">${invitation.event_name || 'Sem nome'}</h3>
                        <p class="text-white/60 mb-4">${invitation.event_type || 'Tipo não definido'}</p>
                        <div class="flex gap-2">
                            <button class="flex-1 px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-sm">
                                <i class="fas fa-edit mr-1"></i>Editar
                            </button>
                            <button class="flex-1 px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg text-sm">
                                <i class="fas fa-eye mr-1"></i>Ver
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Load history error:', err);
            }
        }
        
        // Initialize app
        document.addEventListener('DOMContentLoaded', () => {
            showWindow('chatbot');
        });
    </script>
</body>
</html>
